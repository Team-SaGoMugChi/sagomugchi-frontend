<script type="module">
import * as THREE from 'three';

// ───────────────── 시간 도구 ─────────────────
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const E={
  out:t=>1-Math.pow(1-t,3), in:t=>t*t*t, io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  back:t=>{const c=1.6;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);},
  expo:t=>t===1?1:1-Math.pow(2,-10*t), lin:t=>t,

const prog=(t,a,b,e=E.out)=>e(clamp((t-a)/(b-a)));
// 키프레임: [[시간,값,이징],...]
const kf=(t,k)=>{if(t<=k[0][0])return k[0][1];for(let i=1;i<k.length;i++){if(t<=k[i][0]){const e=k[i][2]||E.io;return lerp(k[i-1][1],k[i][1],e((t-k[i-1][0])/(k[i][0]-k[i-1][0])));}}return k[k.length-1][1];};
const D=THREE.MathUtils.degToRad;
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;};
const L=document.getElementById('L');
const add=(h)=>{const e=$(h);L.appendChild(e);return e;};
const css=(e,o)=>Object.assign(e.style,o);

// ───────────────── 타이포: 글자 단위 등장/퇴장 ─────────────────
function headline(lines,top,{size=104,align='left'}={}){
  const e=add(`<div class="head" style="top:${top}px;text-align:${align}"><div class="h" style="font-size:${size}px"></div></div>`);
  const h=e.firstChild; const chars=[];
  lines.forEach((ln,li)=>{
    const row=document.createElement('div');
    [...ln.text].forEach(ch=>{const s=document.createElement('span');s.className='c';s.textContent=ch===' '?' ':ch;if(ln.em)s.style.color='var(--brown)';row.appendChild(s);chars.push({s,li});});
    h.appendChild(row);
  });

    let i=0;

      i++;

    e.style.display=(t<tin-.1||(tout&&t>tout+1.2))?'none':'block';
  };
  return e;
}
function pill(text,top,left=150){return add(`<div class="pill" style="position:absolute;top:${top}px;left:${left}px"><i></i>${text}</div>`);}

// ───────────────── 3D 준비 ─────────────────
const R=new THREE.WebGLRenderer({canvas:document.getElementById('g3d'),antialias:true,alpha:true,preserveDrawingBuffer:true});
R.setPixelRatio(1);R.setSize(1080,1920,false);R.outputColorSpace=THREE.SRGBColorSpace;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;
R.shadowMap.enabled=true;R.shadowMap.type=THREE.VSMShadowMap;R.setClearColor(0,0);

heart.castShadow=true;ch.add(heart);

R2.setPixelRatio(1);R2.outputColorSpace=THREE.SRGBColorSpace;R2.toneMapping=THREE.ACESFilmicToneMapping;R2.setClearColor(0,0);

const stage=new THREE.Group();stage.visible=false;S2.add(stage);
{const floor=new THREE.Mesh(new THREE.PlaneGeometry(14,14),new THREE.MeshStandardMaterial({color:'#e3cfba',roughness:.95}));
 floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;stage.add(floor);
 const wall=new THREE.Mesh(new THREE.PlaneGeometry(14,7),new THREE.MeshStandardMaterial({color:'#f1e2d2',roughness:1}));
 wall.position.set(0,3.5,-2.4);wall.receiveShadow=true;stage.add(wall);
 const base=new THREE.Mesh(new THREE.BoxGeometry(14,.12,.04),new THREE.MeshStandardMaterial({color:'#d6bea6',roughness:.9}));
 base.position.set(0,.06,-2.38);stage.add(base);
 const rug=new THREE.Mesh(new THREE.CircleGeometry(1.05,64),new THREE.MeshStandardMaterial({color:'#d9b99c',roughness:1}));
 rug.rotation.x=-Math.PI/2;rug.position.set(0,.002,-.25);rug.scale.set(1,.72,1);rug.receiveShadow=true;stage.add(rug);
 const ring=new THREE.Mesh(new THREE.RingGeometry(.95,1.0,64),new THREE.MeshStandardMaterial({color:'#c9a688',roughness:1}));
 ring.rotation.x=-Math.PI/2;ring.position.set(0,.003,-.25);ring.scale.set(1,.72,1);stage.add(ring);
 // 창문 빛(벽에 비친 사각 빛 두 개)
 for(const x of [-.75,.75]){const win=new THREE.Mesh(new THREE.PlaneGeometry(.9,1.3),new THREE.MeshBasicMaterial({color:'#fff6ea',transparent:true,opacity:.55}));
  win.position.set(x+.2,1.75,-2.39);win.rotation.z=.06;stage.add(win);}
}
const ch2=SU.clone(ch);ch2.remove(ch2.children.find(o=>o.isMesh&&o.geometry===hg));S2.add(ch2);
ch2.traverse(o=>{if(o.isMesh)o.castShadow=true;});
const b2={};ch2.traverse(o=>{if(o.isBone)b2[o.name]=o;if(o.isSkinnedMesh){o.material=mat;}});
ch2.children.filter(o=>o.material&&o.material.isShadowMaterial).forEach(o=>o.material=new THREE.ShadowMaterial({opacity:.25}));
const sh2=ch2.children.find(o=>o.material&&o.material.isShadowMaterial);
const cam2=new THREE.PerspectiveCamera(26,580/1210,.05,50);

// ───────────────── 캐릭터 포즈(절차적 애니메이션) ─────────────────
function reset(b){for(const n in b){const o=b[n];o.rotation.set(0,0,0);o.scale.set(1,1,1);o.userData.p0??=o.position.clone();o.position.copy(o.userData.p0);}}
function idle(b,t,amp=1){
  b.body.rotation.z+=D(1.6*amp)*Math.sin(t*1.25);
  const br=Math.sin(t*2.3)*.013*amp; b.body.scale.y*=1+br; b.body.scale.x*=1-br*.5; b.body.scale.z*=1-br*.5;
  b.head.rotation.z+=D(2.2*amp)*Math.sin(t*.9+1); b.head.rotation.x+=D(1.6*amp)*Math.sin(t*1.1);
  b.armL.rotation.z+=D(3*amp)*Math.sin(t*1.25+.4); b.armR.rotation.z-=D(3*amp)*Math.sin(t*1.25+.4);
  const tw=(c)=>Math.exp(-Math.pow(((t+c)%2.7)-0.15,2)*120)*D(14); // 주기적 귀 쫑긋
  b.earL.rotation.z+=D(2)*Math.sin(t*1.7)+tw(.3); b.earR.rotation.z-=D(2)*Math.sin(t*1.7+.5)+tw(1.6);
}
function wave(b,t,w=1){ // 팔을 몸 바깥으로 빼서 볼 옆으로 올리고 손을 흔든다(겨드랑이가 몸에 붙어 보이지 않게)
  const s=Math.sin(t*8.5);
  b.armL.position.x+=-.1*w; b.armL.position.z+=.06*w;
  b.armL.rotation.x+=D(-20)*w; b.armL.rotation.z+=D(-120+7*s)*w;
  b.armL.scale.x*=lerp(1,1.12,w); b.armL.scale.y*=lerp(1,1.3,w); b.armL.scale.z*=lerp(1,1.12,w);
  b.pawL.rotation.z+=D(-10+26*Math.sin(t*8.5+.7))*w;
  b.head.rotation.z+=D(6)*w; b.body.rotation.z+=D(-3)*w;
}
function nod(b,t,at){for(const a of at){const p=t-a;if(p>0&&p<.55)b.head.rotation.x+=D(9)*Math.sin(p/.55*Math.PI);}}
function hug(b,w){ // 하트 끌어안기
  b.armL.rotation.x+=D(-62)*w; b.armL.rotation.z+=D(32)*w; b.armL.scale.y*=lerp(1,1.25,w);
  b.armR.rotation.x+=D(-62)*w; b.armR.rotation.z+=D(-32)*w; b.armR.scale.y*=lerp(1,1.25,w);
}

// ───────────────── 표정(미소·^^눈·깜빡임) 시간표 ─────────────────
const BLINKS=[1.25,4.3,6.95,9.1,12.6,14.6,17.0,19.4,21.4,24.05,26.3];

  const happy=clamp(kf(t,[[0,0],[21.3,0],[21.55,1],[22.6,1],[22.85,0],[24.25,0],[24.5,1],[25.7,1],[25.95,0],[27,0]]));
  // 웃는 표정(ω 입·^^ 눈)은 부자연스러워 쓰지 않는다. 눈 깜빡임만 남긴다.
  void smile; void happy;
  return {smile:0,happy:0,blink};
}

// ───────────────── 장면 요소 ─────────────────
// S1
const s1=headline([{text:'오늘 하루,'},{text:'괜찮았어요?',em:true}],330,{size:124});
// S2
const s2=headline([{text:'괜찮다고 했지만'},{text:'사실 잘 모르겠는 날',em:true}],250,{size:82});
const words=[['피곤함',150,740,.9],['서운함',690,660,.35],['답답함',140,1060,.2],['불안',760,980,.8],['외로움',700,1320,.55],['짜증',160,1400,.7],['무기력',420,560,.08],['걱정',720,1620,.95]];

// S3
const p3=pill('말하기',230);
const s3=headline([{text:'오또랑'},{text:'3분만 이야기해요',em:true}],320,{size:86});
const phone=add(`<div class="phone" style="left:230px;top:610px"><div class="screen"><img src="call_room_day.jpg"><div class="notch"></div>
 <div class="status"><b></b>오또 · 02:41</div><div class="pip"><div class="hd"></div><div class="bd"></div></div>
 <div class="sub"><small>오또</small><span id="q"></span></div><div class="wave">${'<span></span>'.repeat(18)}</div></div></div>`);
const scr=phone.querySelector('.screen'); const qEl=phone.querySelector('#q'); const waveBars=[...phone.querySelectorAll('.wave span')];

const p4=pill('감정 읽기',230);
const s4=headline([{text:'목소리, 표정, 말까지'},{text:'평소의 나와 비교해요',em:true}],320,{size:78});
const ICON={
 v:`<svg width="56" height="56" viewBox="0 0 56 56"><g fill="#603E2B">${[8,18,28,38,48].map((x,i)=>`<rect x="${x-3}" y="${28-[8,16,22,14,6][i]}" width="6" height="${[8,16,22,14,6][i]*2}" rx="3"/>`).join('')}</g></svg>`,
 f:`<svg width="56" height="56" viewBox="0 0 56 56" fill="none" stroke="#603E2B" stroke-width="4" stroke-linecap="round"><circle cx="28" cy="28" r="22"/><circle cx="20" cy="24" r="2.5" fill="#603E2B"/><circle cx="36" cy="24" r="2.5" fill="#603E2B"/><path d="M20 37c4-3 12-3 16 0"/></svg>`,
 t:`<svg width="56" height="56" viewBox="0 0 56 56" fill="none" stroke="#603E2B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14h36v22H26l-10 8v-8h-6z"/><path d="M18 23h20M18 29h12"/></svg>`};
const mods=[['v','목소리','평소보다 낮고 느려요'],['f','표정','입꼬리가 살짝 내려갔어요'],['t','말','“괜찮다고는 했는데…”']].map(([k,a,b],i)=>{

const res=add(`<div class="card res" style="top:640px"><div style="font-weight:800;font-size:34px;color:var(--muted)">오늘의 마음</div>
 <div style="font-weight:900;font-size:68px;letter-spacing:-3px;margin-top:6px">조금 <span style="color:var(--brown)">상처받은</span> 하루</div>
 ${[['상처',58,'#603E2B'],['불안',27,'#B58463'],['기쁨',15,'#EE8A45']].map(([n,v,c])=>`<div class="lb"><span>${n}</span><span data-v="${v}">0%</span></div><div class="bar"><b data-v="${v}" style="background:${c};width:0"></b></div>`).join('')}
 </div>`);
const resNums=[...res.querySelectorAll('span[data-v]')], resBars=[...res.querySelectorAll('b[data-v]')];
// S5
const p5=pill('숏폼 일기',230);
const s5=headline([{text:'오늘의 나를,'},{text:'한 발짝 떨어져서',em:true}],320,{size:86});
const film=add(`<div class="film" style="left:220px;top:640px;background:#f1e2d2"><div class="vignette"></div><div class="tag">10월 31일의 나</div>
 <div class="cap">괜찮은 척 웃었지만,<br>사실 조금 서운했던 하루.</div><div class="pb"><b></b></div></div>`);
const filmPb=film.querySelector('.pb b'), filmCap=film.querySelector('.cap');
// S6
const p6=pill('상담 · 리포트',230);
const s6=headline([{text:'그리고 내 마음을'},{text:'다르게 보는 연습',em:true}],320,{size:86});
const rep=add(`<div class="card rep" style="top:600px"><div class="k"><i></i>알아차린 것</div><div class="v">늦은 답장에<br>서운함이 컸어요</div><hr>
 <div class="k"><i style="background:#4F9775"></i>다르게 보기</div><div class="v">상대도 바빴을 수 있어요.<br>오늘은 나부터 챙겨요.</div></div>`);
// S7
const mark=add(`<div class="mark" style="top:1010px"><div class="w">오또<svg viewBox="0 0 24 24"><path fill="#EE8A45" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.6.1.2.4.2.5 0 .7-1.4 2.2-2.6 4.3-2.6 3.7 0 5.8 3.8 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg></div>
 <div class="tl">한 발짝 떨어져 보는 <b>나의 감정 일기</b></div></div>`);
const markW=mark.querySelector('.w'), markT=mark.querySelector('.tl');

// ───────────────── 타임라인 ─────────────────
const T={s1:0,s2:3.2,s3:6.6,s4:11.2,s5:15.6,s6:20.0,s7:23.6,end:27.0};
window.DURATION=T.end;

function render(t){
  blobs(t);
  // ── 3D 메인 캐릭터 ──
  reset(bones); heart.visible=false;
  let vis=true, cx=0, cy=0, cz=0, sc=1, ry=0;
  cam.position.set(0,.5,3.0); cam.lookAt(0,.5,0);
  const lt=t;
  if(t<T.s2){ // S1: 아래에서 빼꼼
    const rise=prog(t,.9,1.9,E.back);
    sc=.86; cy=lerp(-1.3,-.1375-.33*sc,rise);
    idle(bones,lt,.8);
    bones.head.rotation.z+=D(lerp(0,-9,prog(t,1.6,2.3)));
    const pk=Math.exp(-Math.pow(t-1.95,2)*40); bones.earL.rotation.z+=D(-16)*pk; bones.earR.rotation.z+=D(16)*pk;
    // S2로 넘어가며 뒤로 물러남
    const out=prog(t,2.95,3.6,E.io); cy=lerp(cy,0,out); sc=lerp(.86,.62,out);
  } else if(t<T.s3){ // S2: 갸웃
    sc=.62; cy=0; const tt=t-T.s2;
    idle(bones,lt,1);
    bones.head.rotation.z+=D(kf(tt,[[0,0],[.8,11],[2.2,-6],[3.0,10]]));
    bones.body.rotation.y+=D(kf(tt,[[0,0],[1.5,-10],[3,6]]));
    const out=prog(t,T.s3-.35,T.s3+.05,E.in); cy=lerp(0,-.9,out);
  } else if(t<T.s4){ vis=false; }
  else if(t<T.s5){ // S4: 왼쪽 아래에서 카드 바라보기
    const tt=t-T.s4; const inn=prog(tt,2.9,3.6,E.back); const out=prog(t,T.s5-.4,T.s5,E.in);
    sc=.55; cx=lerp(.75,.13,inn); cy=-.1-out*.7; ry=D(-22);
    idle(bones,lt,1); bones.head.rotation.x+=D(-10); bones.head.rotation.z+=D(6);
    nod(bones,tt,[3.9,4.25]);
  } else if(t<T.s6){ vis=false; }
  else if(t<T.s7){ // S6: 하트 안기
    const tt=t-T.s6; const inn=prog(tt,.5,1.3,E.back); const out=prog(t,T.s7-.35,T.s7+.1,E.in);
    sc=.5; cx=.2; cy=lerp(-.7,-.1,inn)-out*.8; ry=D(-14);
    idle(bones,lt,.8); const w=prog(tt,.9,1.5,E.out); hug(bones,w);
    bones.head.rotation.z+=D(-6)*w; bones.body.rotation.x+=D(4)*w;
    heart.visible=true; const hb=1+.06*Math.max(0,Math.sin(tt*6))*w;
    heart.position.set(0,.24,.21); heart.scale.setScalar(lerp(.2,1,prog(tt,.8,1.4,E.back))*hb*1.0); heart.rotation.set(D(-8),0,0);
  } else { // S7: 엔딩 인사
    const tt=t-T.s7; const inn=prog(tt,.0,.9,E.back);
    sc=lerp(.34,.46,inn); cy=lerp(.38,.53,inn);
    idle(bones,lt,1); const wv=prog(tt,.6,1.0,E.out)*(1-prog(tt,2.7,3.2,E.io));
    X.waveArm(ch,bones,wv,lt); bones.head.rotation.z+=D(6)*wv; bones.body.rotation.z+=D(-3)*wv;
    bones.body.position.y+=Math.abs(Math.sin(tt*3.2))*.012*(1-prog(tt,1,1.5));
  }
  if(!(t>=T.s7)) X.waveArm(ch,bones,0,lt);
  X.expr(ch,exprAt(t));
  ch.visible=vis; ch.position.set(cx,cy,cz); ch.scale.setScalar(sc); ch.rotation.y=ry;
  R.render(S,cam);

  // ── S1 ──
  s1.update(t,.25,2.9);
  // ── S2 ──
  s2.update(t,T.s2+.15,T.s3-.45);
  chips.forEach((c,i)=>{const a=T.s2+.35+i*.12; const p=prog(t,a,a+.8,E.out); const q=prog(t,T.s3-.5,T.s3,E.in);
    const tt=t-T.s2; const dx=Math.sin(tt*.7+i*1.7)*26, dy=Math.cos(tt*.6+i)*22-(1-p)*80;
    const blur=Math.abs(c.z-.5)*9, s=lerp(.78,1.12,c.z);
    css(c.e,{opacity:p*(1-q)*lerp(.55,1,c.z),transform:`translate(${dx}px,${dy}px) scale(${s*lerp(.8,1,p)}) rotate(${Math.sin(tt*.5+i)*4}deg)`,filter:`blur(${blur+(1-p)*8}px)`,display:t>T.s2-.1&&t<T.s3+.2?'':'none'});});
  // ── S3: 통화 ──
  const in3=prog(t,T.s3+.25,T.s3+1.15,E.out), out3=prog(t,T.s4-.45,T.s4,E.in);
  popIn(p3,t,T.s3+.05,T.s4-.5); s3.update(t,T.s3+.15,T.s4-.5);
  const shown3=t>T.s3&&t<T.s4+.1;
  css(phone,{display:shown3?'':'none',transform:`translateY(${(1-in3)*1300+out3*-140}px) rotate(${(1-in3)*8}deg) scale(${1-out3*.06})`,opacity:1-out3});
  if(shown3){
    const tt=t-T.s3; // 질문 타이핑
    const n=Math.floor(clamp((tt-1.3)/1.6)*QTXT.length); qEl.textContent=QTXT.slice(0,n)+(n<QTXT.length&&tt>1.3?'▍':'');
    const talk=tt>3.3; waveBars.forEach((s,i)=>{const h=talk?14+Math.abs(Math.sin(tt*9+i*.9)*Math.sin(tt*3.1+i*.37))*58:10;css(s,{height:h+'px',opacity:talk?1:.5});});
    if(!scr.contains(R2.domElement)) scr.insertBefore(R2.domElement,scr.children[1]);
    R2.setSize(580,1210,false);
    reset(b2); idle(b2,tt,1.2); nod(b2,tt,[1.1,1.9,3.8,4.6]);
    b2.head.rotation.z+=D(kf(tt,[[0,0],[1.2,-6],[2.6,5],[3.6,-3]]));
    if(tt>3.3) b2.head.rotation.x+=D(-5)*Math.min(1,(tt-3.3)*2);
    X.waveArm(ch2,b2,0,tt); X.expr(ch2,exprAt(t)); stage.visible=false; sh2.visible=true;
    ch2.position.set(0,0,0); ch2.scale.setScalar(1); ch2.rotation.y=0;
    cam2.aspect=580/1210; cam2.fov=26; cam2.updateProjectionMatrix(); cam2.position.set(0,.62,3.7); cam2.lookAt(0,.5,0);
    R2.render(S2,cam2);
  }
  // ── S4 ──
  popIn(p4,t,T.s4+.05,T.s5-.45); s4.update(t,T.s4+.15,T.s5-.45);
  mods.forEach((m,i)=>{const a=T.s4+.7+i*.28;const p=prog(t,a,a+.6,E.back);const merge=prog(t,T.s4+2.55,T.s4+3.0,E.in);
    css(m,{display:t>T.s4&&t<T.s4+3.1?'':'none',opacity:clamp(p*2)*(1-merge),transform:`translateX(${(1-p)*(i%2?-1:1)*700}px) translateY(${merge*(200-i*200)}px) scale(${1-merge*.2})`});});
  const rIn=prog(t,T.s4+2.85,T.s4+3.45,E.back), rOut=prog(t,T.s5-.45,T.s5,E.in);
  css(res,{display:t>T.s4+2.8&&t<T.s5+.1?'':'none',opacity:clamp(rIn*2)*(1-rOut),transform:`scale(${lerp(.85,1,rIn)-rOut*.05}) translateY(${-rOut*40}px)`});
  const bp=prog(t,T.s4+3.2,T.s4+4.1,E.out);
  resBars.forEach((b,i)=>{const v=+b.dataset.v;css(b,{width:(v*prog(t,T.s4+3.2+i*.12,T.s4+4.1+i*.12,E.out))+'%'});});
  resNums.forEach((s,i)=>{s.textContent=Math.round(+s.dataset.v*prog(t,T.s4+3.2+i*.12,T.s4+4.1+i*.12,E.out))+'%';});
  // ── S5: 한 발짝 떨어져서(줌아웃) ──
  popIn(p5,t,T.s5+1.2,T.s6-.45); s5.update(t,T.s5+1.25,T.s6-.45);
  const shown5=t>T.s5-.05&&t<T.s6+.1;
  if(shown5){
    const tt=t-T.s5; const z=prog(tt,1.0,2.4,E.io); const out5=prog(t,T.s6-.45,T.s6,E.in);
    const s=lerp(1.45,1,z); const ty=lerp(-90,0,z);
    css(film,{display:'',borderRadius:lerp(0,56,z)+'px',transform:`translateY(${ty-out5*80}px) scale(${s*(1-out5*.08)})`,opacity:1-out5});
    css(filmCap,{opacity:prog(tt,2.3,2.9)});
    css(filmPb,{width:(clamp((tt-.2)/4.2)*100)+'%'});
    if(!film.contains(R2.domElement)) film.insertBefore(R2.domElement,film.children[1]);
    R2.setSize(640,1138,false);
    reset(b2); idle(b2,tt,.7); X.waveArm(ch2,b2,0,tt); X.expr(ch2,exprAt(t)); stage.visible=true; sh2.visible=false;
    // 뒤로 크게 한 걸음: 웅크림 → 뒤로 폴짝(한쪽 발을 뒤로 뻗음) → 착지 찌그러짐 → 살짝 한 번 더 물러남
    const hop=prog(tt,.45,1.15,E.io), arc=Math.sin(hop*Math.PI);
    const hop2=prog(tt,1.35,1.75,E.io), arc2=Math.sin(hop2*Math.PI);
    const crouch=Math.exp(-Math.pow(tt-.4,2)*90)*.06, land=Math.exp(-Math.pow(tt-1.2,2)*110)*.07+Math.exp(-Math.pow(tt-1.78,2)*140)*.035;
    const pz=lerp(.2,-.75,hop)+lerp(0,-.2,hop2), py=arc*.075+arc2*.03;
    b2.body.scale.y*=1-crouch-land; b2.body.scale.x*=1+(crouch+land)*.5; b2.body.scale.z*=1+(crouch+land)*.5;
    b2.body.rotation.x+=D(-9)*arc+D(-4)*arc2;                     // 뒤로 몸을 젖히며 점프
    b2.legR.rotation.x+=D(-28)*arc+D(-14)*arc2; b2.legL.rotation.x+=D(10)*arc;
    b2.armL.rotation.z+=D(-22)*arc; b2.armR.rotation.z+=D(22)*arc; // 균형 잡는 팔
    b2.earL.rotation.z+=D(-12)*arc; b2.earR.rotation.z+=D(12)*arc;
    // 물러난 뒤에는 고개를 살짝 숙이고 오늘을 돌아본다
    const settle=prog(tt,1.9,2.6,E.io);
    b2.head.rotation.x+=D(10)*settle; b2.head.rotation.z+=D(-5)*settle; b2.body.rotation.x+=D(5)*settle;
    b2.earL.rotation.z+=D(16)*settle; b2.earR.rotation.z+=D(-16)*settle;
    ch2.position.set(.04,py,pz); ch2.rotation.y=D(lerp(-8,-24,settle)); ch2.scale.setScalar(1);
    cam2.aspect=640/1138; cam2.fov=lerp(26,30,z); cam2.updateProjectionMatrix();
    cam2.position.set(lerp(.05,.5,z),lerp(.62,.75,z),lerp(3.0,3.4,z)); cam2.lookAt(0,.4,lerp(-.1,-.3,z));
    R2.render(S2,cam2);
  } else css(film,{display:'none'});
  // ── S6 ──
  popIn(p6,t,T.s6+.05,T.s7-.4); s6.update(t,T.s6+.15,T.s7-.4);
  const r6=prog(t,T.s6+.6,T.s6+1.2,E.back), o6=prog(t,T.s7-.4,T.s7,E.in);
  css(rep,{display:t>T.s6+.5&&t<T.s7+.1?'':'none',opacity:clamp(r6*2)*(1-o6),transform:`translateY(${(1-r6)*80-o6*40}px) scale(${lerp(.92,1,r6)})`});
  // ── S7 ──
  const m1=prog(t,T.s7+.5,T.s7+1.2,E.back), m2=prog(t,T.s7+.9,T.s7+1.6,E.out);
  css(mark,{display:t>T.s7?'':'none'});
  css(markW,{opacity:clamp(m1*2),transform:`translateY(${(1-m1)*60}px) scale(${lerp(.7,1,m1)})`});
  css(markT,{opacity:m2,transform:`translateY(${(1-m2)*30}px)`});
  document.getElementById('fade').style.opacity=prog(t,0,.0001)>0?0:1;
}
window.render=render;
await document.fonts.ready;
render(0); window.DONE=true;
</script></body></html>
