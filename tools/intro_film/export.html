<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body><script type="module">
import * as THREE from 'three';
import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';
import {loadRig, BONE_NAMES} from './rig.js';
import {velvet} from './look.js';


const D=THREE.MathUtils.degToRad, TAU=Math.PI*2;
const rig=await loadRig(); const b=rig.bones;
const m=velvet(rig.material); m.color.set('#c7a896'); rig.mesh.material=m;
// Facial morphs deform the original eye surface; no face stickers or replacement arms.
const rest = rig.mesh.geometry.attributes.position;
const morphs = [rest.clone(), rest.clone()];
for(let i=0;i<rest.count;i++) {
 const x=rest.getX(i),y=rest.getY(i),z=rest.getZ(i);
 const ex=x<0?-.12:.12;
 const d=Math.hypot((x-ex)/.064,(y-.585)/.075);
 const w=z>.20 ? 1-THREE.MathUtils.smoothstep(d,.75,1.35) : 0;
 if(w>0){
   morphs[0].setY(i,y+((.585+(y-.585)*.08)-y)*w);
   const curve=.012*Math.cos((x-ex)/.064*Math.PI);
   morphs[1].setY(i,y+((.585+curve+(y-.585)*.08)-y)*w);
 }
}
rig.mesh.geometry.morphAttributes.position=morphs;
rig.mesh.updateMorphTargets();
rig.mesh.morphTargetDictionary={Blink:0,Happy:1};
function blink(t,at=2.2) { if(t>at && t<at+.18) rig.mesh.morphTargetInfluences[0]=1; }
// 원본 연결 메시만 사용한다. 별도 팔과 원래 팔 축소는 내보내지 않는다.
function reset(){rig.mesh.morphTargetInfluences.fill(0);for(const n of BONE_NAMES){const o=b[n];o.rotation.set(0,0,0);o.scale.set(1,1,1);o.userData.p0??=o.position.clone();o.position.copy(o.userData.p0);}}
function idle(t,P,amp=1){const w=TAU/P;
  b.body.rotation.z+=D(1.6*amp)*Math.sin(w*t);
  const br=Math.sin(2*w*t)*.013*amp; b.body.scale.set(1-br*.5,1+br,1-br*.5);
  b.head.rotation.z+=D(2.2*amp)*Math.sin(w*t+1); b.head.rotation.x+=D(1.6*amp)*Math.sin(w*t);
  b.armL.rotation.z+=D(3*amp)*Math.sin(w*t+.4); b.armR.rotation.z-=D(3*amp)*Math.sin(w*t+.4);
  const tw=Math.exp(-Math.pow((t%P)-P*.55,2)*120)*D(14);
  b.earL.rotation.z+=D(2)*Math.sin(2*w*t)+tw; b.earR.rotation.z-=D(2)*Math.sin(2*w*t+.5)+tw*.6;}
const CLIPS={
  Idle:{P:4,f:t=>{idle(t,4);blink(t);}},
  Welcome:{P:6,f:t=>{idle(t,6,.65);const w=.5-.5*Math.cos(TAU*t/6);b.armL.rotation.z+=D(-16)*w;b.pawL.rotation.x+=D(8)*Math.sin(TAU*t/3)*w;b.head.rotation.z+=D(4)*w;blink(t,2.4);}},
  Listen:{P:6,f:t=>{idle(t,6,.35);b.head.rotation.z+=D(-6);b.head.rotation.y+=D(-4)*Math.sin(TAU*t/6);b.earR.rotation.z+=D(4)*Math.sin(TAU*t/6);blink(t,3.5);}},
  Ready:{P:4,f:t=>{idle(t,4,.3);const nod=t<1.6?Math.sin(t/1.6*TAU):0;b.head.rotation.x+=D(7)*nod;if(t>.8){rig.mesh.morphTargetInfluences[1]=1;}blink(t,.35);}},
  Wave:{P:2,f:t=>{idle(t,2,.45); b.armL.rotation.z+=D(-12+5*Math.sin(TAU*t/2)); b.pawL.rotation.x+=D(8)*Math.sin(TAU*t/2); b.head.rotation.z+=D(3)*Math.sin(TAU*t/2);}},
  Nod:{P:2,f:t=>{idle(t,2,.6);for(const a of [.2,.85]){const p=t-a;if(p>0&&p<.55)b.head.rotation.x+=D(10)*Math.sin(p/.55*Math.PI);} b.head.rotation.z+=D(4);}},
  Hop:{P:1.2,f:t=>{const p=t/1.2; const air=p>.2&&p<.75?Math.sin((p-.2)/.55*Math.PI):0;
    const squash=p<.2?Math.sin(p/.2*Math.PI)*.08:(p>.75?Math.sin((p-.75)/.25*Math.PI)*.07:-air*.04);
    b.root.position.y=air*.11; b.body.scale.set(1+squash*.6,1-squash,1+squash*.6);
    b.armL.rotation.z+=D(-25)*air; b.armR.rotation.z+=D(25)*air;
    b.earL.rotation.z+=D(10)*air; b.earR.rotation.z-=D(10)*air; b.legL.rotation.x+=D(-12)*air; b.legR.rotation.x+=D(-12)*air;}},
};
const FPS=30, clips=[];
for(const [name,{P,f}] of Object.entries(CLIPS)){
  const n=Math.round(P*FPS)+1, times=[...Array(n)].map((_,i)=>i/FPS);
  const data={}; for(const bn of BONE_NAMES) data[bn]={q:[],s:[],p:[]}; const expressionData=[[],[]];
  for(const t of times){reset();f(name==='Ready'?t:t%P);for(const bn of BONE_NAMES){const o=b[bn];data[bn].q.push(...o.quaternion.toArray());data[bn].s.push(...o.scale.toArray());data[bn].p.push(...o.position.toArray());} for(let k=0;k<2;k++) expressionData[k].push(rig.mesh.morphTargetInfluences[k]);}
  const tracks=[];
  for(const bn of BONE_NAMES){tracks.push(new THREE.QuaternionKeyframeTrack(`${bn}.quaternion`,times,data[bn].q));
    if(data[bn].s.some(v=>Math.abs(v-1)>1e-4)) tracks.push(new THREE.VectorKeyframeTrack(`${bn}.scale`,times,data[bn].s));
    if(bn==='body'||bn==='root'||bn==='armL') tracks.push(new THREE.VectorKeyframeTrack(`${bn}.position`,times,data[bn].p));}
  for(let k=0;k<2;k++) tracks.push(new THREE.NumberKeyframeTrack(`${rig.mesh.name}.morphTargetInfluences[${k===0?"Blink":"Happy"}]`,times,expressionData[k]));
  clips.push(new THREE.AnimationClip(name,P,tracks));
}
reset();
const scene=new THREE.Scene(); scene.add(rig.group);
const glb=await new GLTFExporter().parseAsync(scene,{binary:true,animations:clips,onlyVisible:true});
const u8=new Uint8Array(glb); let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode(...u8.subarray(i,i+0x8000));
window.RESULT=btoa(s); window.DONE=true;
</script></body></html>
